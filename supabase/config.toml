project_id = "company-setup-os"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3100/auth/callback"]
enable_signup = true
minimum_password_length = 12
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
[storage]
enabled = true
file_size_limit = "10MiB"

# These three authenticate inside the handler: Stripe signatures or worker secret/user JWT.
[functions.stripe-webhook]
verify_jwt = false
[functions.source-monitor]
verify_jwt = false
[functions.notify]
verify_jwt = false
